name: Release image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub (docker.io/imibrar/stubyard): repository secret DOCKERHUB_TOKEN (a Docker Hub access token with
      # Read & Write scope); the user name defaults to imibrar, or set the repository variable DOCKERHUB_USERNAME.
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'imibrar' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/imibrar/stubyard
            docker.io/imibrar/stubyard
          # v1.2.3 → 1.2.3 and latest; a manual run without a tag → the branch name
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=stubyard
            org.opencontainers.image.source=https://github.com/imibrar/stubyard
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Fake email, SMS, WhatsApp, payment, storage and login providers for local testing, in one container
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
