name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The end-to-end tests spawn a real Mailpit (they are skipped without it); take the binary from the same
      # image the Dockerfile uses.
      - name: Install Mailpit
        run: |
          docker create --name mailpit axllent/mailpit:v1.27
          sudo docker cp mailpit:/mailpit /usr/local/bin/mailpit
          docker rm mailpit
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
