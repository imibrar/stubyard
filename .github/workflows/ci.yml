name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Teams mode tests (test/teams.e2e.test.ts) run against this throwaway database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stubyard
          POSTGRES_PASSWORD: stubyard
          POSTGRES_DB: stubyard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stubyard -d stubyard_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      STUBYARD_TEST_DATABASE_URL: postgres://stubyard:stubyard@localhost:5432/stubyard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The end-to-end tests spawn a real Mailpit (they are skipped without it); take the binary from the same
      # image the Dockerfile uses.
      - name: Install Mailpit
        run: |
          docker create --name mailpit axllent/mailpit:v1.27
          sudo docker cp mailpit:/mailpit /usr/local/bin/mailpit
          docker rm mailpit
      # Pinned boto3 for the boto3 conformance test (same version as docker/dev-boto3.Dockerfile).
      - name: Install boto3
        run: python3 -m pip install --user --break-system-packages boto3==1.44.7
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
