# Example: connecting YOUR app's docker-compose.yml to devhub.
# devhub must already be running (deploy/docker-compose.yml), which creates the "devhub" network.
#
# Copy the relevant parts into your app's compose file. Replace "hyper" with your project slug.

services:
  app:
    image: your-app:dev
    networks:
      - default
      - devhub            # join devhub's network → devhub is reachable as host "devhub"
    environment:
      # ---- Email (SMTP) ----
      SMTP_HOST: devhub
      SMTP_PORT: "1025"
      SMTP_USER: hyper                  # project slug (or "hyper.marketing" for a specific email provider instance)
      SMTP_PASSWORD: devhub             # any value
      SMTP_SECURE: "false"

      # ---- SMS / WhatsApp / external APIs (simulators arrive in phase 2) ----
      SMS_BASE_URL: https://devhub:4443/mock/hyper/sms-primary
      WHATSAPP_BASE_URL: https://devhub:4443/mock/hyper/wa-main

      # ---- Trust devhub's HTTPS certificate (Node example; see /https in the dashboard for other languages) ----
      NODE_EXTRA_CA_CERTS: /certs/devhub-ca.crt
    volumes:
      # Download once:  curl -o devhub-ca.crt http://localhost:4000/api/ca.crt
      - ./devhub-ca.crt:/certs/devhub-ca.crt:ro

networks:
  devhub:
    external: true
