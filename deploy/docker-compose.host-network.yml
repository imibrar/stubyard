# devhub with host networking (Linux only).
#
# Use this instead of deploy/docker-compose.yml when your app runs directly on the host and listens on 127.0.0.1
# (e.g. `npm run dev`, `php artisan serve`, `rails s` defaults): with normal Docker networking devhub's container
# cannot reach 127.0.0.1 of the host, so status callbacks / inbound messages / webhooks to your app would fail.
#
# Here devhub shares the host's network stack: callback URLs like http://localhost:3000/... just work, and
# DEVHUB_HOST=127.0.0.1 keeps devhub reachable from this machine only (no port publishing is involved).
#
# Start:   docker compose -f deploy/docker-compose.host-network.yml up -d --build
# Stop:    docker compose -f deploy/docker-compose.host-network.yml down
# Data:    same "devhub-data" volume as deploy/docker-compose.yml (run only one of the two at a time).
#
# Docker Desktop (macOS / Windows) does not support this the same way; there, start your app on 0.0.0.0 and use
# http://host.docker.internal:<port> with deploy/docker-compose.yml.

name: devhub

services:
  devhub:
    image: devhub:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: devhub
    restart: unless-stopped
    network_mode: host
    environment:
      DEVHUB_HOST: ${DEVHUB_HOST:-127.0.0.1}       # 0.0.0.0 to expose devhub on the LAN
      DEVHUB_HTTP_PORT: ${DEVHUB_HTTP_PORT:-4000}
      DEVHUB_HTTPS_PORT: ${DEVHUB_HTTPS_PORT:-4443}
      DEVHUB_SMTP_PORT: ${DEVHUB_SMTP_PORT:-1025}
      # The embedded Mailpit also uses host ports: 127.0.0.1:8025 (HTTP) and this SMTP port; they must be free.
      DEVHUB_MAILPIT_SMTP_PORT: ${DEVHUB_MAILPIT_SMTP_PORT:-1026}
      DEVHUB_LOG_LEVEL: ${DEVHUB_LOG_LEVEL:-info}
      DEVHUB_TLS_NAMES: ${DEVHUB_TLS_NAMES:-}
      DEVHUB_OUTBOUND_ALLOW: ${DEVHUB_OUTBOUND_ALLOW:-}
      DEVHUB_OUTBOUND_INSECURE_TLS: ${DEVHUB_OUTBOUND_INSECURE_TLS:-0}
      # DEVHUB_SEED: /config
    volumes:
      - devhub-data:/data
      # - ./seed:/config:ro
    extra_hosts:
      # Same callback URLs as in the bridged setup keep working: host.docker.internal = this machine.
      - "host.docker.internal:127.0.0.1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.DEVHUB_HTTP_PORT || 4000) + '/api/system').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  devhub-data:
    name: devhub-data
