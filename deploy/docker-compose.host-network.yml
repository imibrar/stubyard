# stubyard with host networking (Linux only).
#
# Use this instead of deploy/docker-compose.yml when your app runs directly on the host and listens on 127.0.0.1
# (e.g. `npm run dev`, `php artisan serve`, `rails s` defaults): with normal Docker networking stubyard's container
# cannot reach 127.0.0.1 of the host, so status callbacks / inbound messages / webhooks to your app would fail.
#
# Here stubyard shares the host's network stack: callback URLs like http://localhost:3000/... just work, and
# STUBYARD_HOST=127.0.0.1 keeps stubyard reachable from this machine only (no port publishing is involved).
#
# Start:   docker compose -f deploy/docker-compose.host-network.yml up -d --build
# Stop:    docker compose -f deploy/docker-compose.host-network.yml down
# Data:    same "devhub-data" volume as deploy/docker-compose.yml (run only one of the two at a time).
#
# Docker Desktop (macOS / Windows) does not support this the same way; there, start your app on 0.0.0.0 and use
# http://host.docker.internal:<port> with deploy/docker-compose.yml.

name: stubyard

services:
  stubyard:
    image: stubyard:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: stubyard
    restart: unless-stopped
    network_mode: host
    environment:
      STUBYARD_HOST: ${STUBYARD_HOST:-127.0.0.1}       # 0.0.0.0 to expose stubyard on the LAN
      STUBYARD_HTTP_PORT: ${STUBYARD_HTTP_PORT:-4000}
      STUBYARD_HTTPS_PORT: ${STUBYARD_HTTPS_PORT:-4443}
      STUBYARD_SMTP_PORT: ${STUBYARD_SMTP_PORT:-1025}
      # The embedded Mailpit also uses host ports: 127.0.0.1:8025 (HTTP) and this SMTP port; they must be free.
      STUBYARD_MAILPIT_SMTP_PORT: ${STUBYARD_MAILPIT_SMTP_PORT:-1026}
      STUBYARD_LOG_LEVEL: ${STUBYARD_LOG_LEVEL:-info}
      STUBYARD_TLS_NAMES: ${STUBYARD_TLS_NAMES:-}
      STUBYARD_OUTBOUND_ALLOW: ${STUBYARD_OUTBOUND_ALLOW:-}
      STUBYARD_OUTBOUND_INSECURE_TLS: ${STUBYARD_OUTBOUND_INSECURE_TLS:-0}
      # Sign-in (Single admin mode; docs/GUIDE.md "Sign-in (single admin)"). Empty = no login (Open mode). Strongly
      # recommended with STUBYARD_HOST=0.0.0.0. Hash: docker exec -it stubyard node dist/access/hash-password.js
      STUBYARD_ADMIN_EMAIL: ${STUBYARD_ADMIN_EMAIL:-}
      STUBYARD_ADMIN_PASSWORD_HASH: ${STUBYARD_ADMIN_PASSWORD_HASH:-}
      STUBYARD_SESSION_TTL_HOURS: ${STUBYARD_SESSION_TTL_HOURS:-168}
      STUBYARD_COOKIE_SECURE: ${STUBYARD_COOKIE_SECURE:-}
      # Behind a TLS reverse proxy: true, the number of proxies, or their IPs / CIDRs, so failed-sign-in limits count
      # the real client address (X-Forwarded-For). Leave empty when clients reach stubyard directly.
      STUBYARD_TRUST_PROXY: ${STUBYARD_TRUST_PROXY:-}
      # STUBYARD_SEED: /config
    volumes:
      - stubyard-data:/data
      # - ./seed:/config:ro
    extra_hosts:
      # Same callback URLs as in the bridged setup keep working: host.docker.internal = this machine.
      - "host.docker.internal:127.0.0.1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.STUBYARD_HTTP_PORT || 4000) + '/api/system').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  stubyard-data:
    # Docker name kept from the pre-rename "devhub" releases so existing data carries over.
    name: devhub-data
