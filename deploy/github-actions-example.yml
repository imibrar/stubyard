# Example GitHub Actions workflow: run your app's tests against stubyard.
# Copy to .github/workflows/e2e.yml in YOUR app's repository and adapt the marked lines. See docs/CI.md.
#
# stubyard has no published image yet, so this builds it from the stubyard repository. Once an image is published
# (e.g. ghcr.io/<owner>/stubyard), replace the "Build stubyard" step with `docker pull` (or use it as a `services:` entry).

name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUBYARD_URL: http://localhost:4000       # REST API + wait API for the tests
      # App settings pointing at stubyard (adapt to your app's variable names):
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: hyper                        # stubyard project slug (from the seed file)
      SMTP_PASSWORD: stubyard
      TWILIO_BASE_URL: http://localhost:4000/mock/hyper/sms-primary

    steps:
      - uses: actions/checkout@v4

      # ---- stubyard image: build it from source (no registry yet) ----
      - name: Check out stubyard
        uses: actions/checkout@v4
        with:
          repository: imibrar/stubyard          # <-- where the stubyard source lives (or vendor it as a submodule)
          path: .stubyard
      - name: Build stubyard
        uses: docker/build-push-action@v6
        with:
          context: .stubyard
          load: true                           # into the runner's Docker, not pushed anywhere
          tags: stubyard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- start stubyard with the project config committed in this repo ----
      # --network host: stubyard shares the runner's network, so its callbacks reach the app on localhost:<port>
      # even if the app only listens on 127.0.0.1. STUBYARD_HOST=127.0.0.1 keeps it off other interfaces.
      - name: Start stubyard
        run: |
          docker run -d --name stubyard --network host \
            -e STUBYARD_HOST=127.0.0.1 \
            -e STUBYARD_SEED=/config \
            -e STUBYARD_CALLBACK_DELAY_MS=300 \
            -v "$PWD/stubyard:/config:ro" \
            stubyard:ci
          # stubyard/ contains stubyard-hyper.json = curl http://localhost:4000/api/projects/hyper/export
      - name: Wait for stubyard
        run: |
          for i in $(seq 1 60); do
            curl -sf "$STUBYARD_URL/api/system" >/dev/null && break
            sleep 1
          done
          curl -sf "$STUBYARD_URL/api/system"
          # The seed is imported before stubyard starts listening; fail early if the project is missing.
          curl -sf "$STUBYARD_URL/api/projects/hyper" >/dev/null

      # ---- your app + its tests ----
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Start the app
        run: |
          npm run start &                      # <-- your app; it sends email/SMS to stubyard
          npx wait-on http://localhost:3000/health
      - name: Check stubyard can reach the app's callback URLs
        run: curl -s "$STUBYARD_URL/api/projects/hyper/doctor" | jq -e '.ok'
      - name: Tests
        run: npm test                          # tests read codes with $STUBYARD_URL/api/projects/hyper/messages/wait?...

      # ---- diagnostics when something failed ----
      - name: stubyard traffic log
        if: failure()
        run: |
          mkdir -p stubyard-report
          curl -s "$STUBYARD_URL/api/logs?project=hyper&limit=200" > stubyard-report/traffic.json
          curl -s "$STUBYARD_URL/api/projects/hyper/messages?limit=200" > stubyard-report/messages.json
          curl -s "$STUBYARD_URL/api/projects/hyper/doctor" > stubyard-report/doctor.json
          docker logs stubyard > stubyard-report/stubyard.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stubyard-report
          path: stubyard-report
