# stubyard — fake email / SMS / webhook / payment providers for local testing (standalone)
#
# Start:   docker compose up -d        (after: docker load -i stubyard-image.tar.gz)
# Open:    http://localhost:4000
# Stop:    docker compose -f docker-compose.yml down        (data is kept)
# Wipe:    docker compose -f docker-compose.yml down -v     (deletes all data, incl. the HTTPS CA)
#
# Agent guide: AGENT_GUIDE.md, or http://localhost:4000/api/agent-guide from the running stubyard
#
# Linux, app on the host bound to 127.0.0.1? stubyard's callbacks cannot reach it from this container: start the app on
# 0.0.0.0 and use http://host.docker.internal:<port> (or run stubyard with network_mode: host).

name: stubyard

services:
  stubyard:
    image: stubyard:latest
    container_name: stubyard
    hostname: stubyard
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1: only this machine can reach stubyard. Remove "127.0.0.1:" to expose on the LAN.
      - "127.0.0.1:${STUBYARD_HTTP_PORT:-4000}:4000"    # dashboard, REST API, /mock and /hook endpoints
      - "127.0.0.1:${STUBYARD_HTTPS_PORT:-4443}:4443"   # the same over HTTPS (local CA)
      - "127.0.0.1:${STUBYARD_SMTP_PORT:-1025}:1025"    # SMTP for apps
      - "127.0.0.1:${STUBYARD_APNS_PORT:-2197}:2197"    # fake APNs (HTTP/2) for iOS push
    environment:
      STUBYARD_LOG_LEVEL: ${STUBYARD_LOG_LEVEL:-info}
      # Host ports of the two above, for the http(s)://localhost:… addresses stubyard gives apps on this machine
      STUBYARD_HOST_HTTP_PORT: ${STUBYARD_HTTP_PORT:-4000}
      STUBYARD_HOST_HTTPS_PORT: ${STUBYARD_HTTPS_PORT:-4443}
      # Extra hostnames/IPs for the HTTPS certificate (comma separated), e.g. "myhost.local,10.0.0.5"
      STUBYARD_TLS_NAMES: ${STUBYARD_TLS_NAMES:-}
      # Browser-facing base for login-provider pages (authorize/logout), e.g. https://localhost:14443 behind an SSH tunnel
      STUBYARD_PUBLIC_URL: ${STUBYARD_PUBLIC_URL:-}
      # Max bytes of each request/response body kept in the traffic log (bigger bodies are truncated and flagged)
      STUBYARD_MAX_LOG_BODY_BYTES: ${STUBYARD_MAX_LOG_BODY_BYTES:-1048576}
      # Set to 1 to advertise SMTP STARTTLS (clients must then trust the stubyard CA)
      STUBYARD_SMTP_STARTTLS: ${STUBYARD_SMTP_STARTTLS:-0}
      # Hosts stubyard may call (callbacks, event webhooks, webhook templates). Empty = safe default (localhost,
      # host.docker.internal, *.local, *.test, *.internal, private IPs, docker service names). "+a.com,b.org" adds, "*" = any.
      STUBYARD_OUTBOUND_ALLOW: ${STUBYARD_OUTBOUND_ALLOW:-}
      # 1 = accept self-signed HTTPS when calling your app (or a host list: "myapp.test,*.local")
      STUBYARD_OUTBOUND_INSECURE_TLS: ${STUBYARD_OUTBOUND_INSECURE_TLS:-0}
      # AI chat provider keys (optional; set them in .env next to this file). Env keys win over keys stored in the dashboard.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Import project exports at start if their slug doesn't exist yet (a .json file or a directory of them).
      # Uncomment together with the ./seed volume below.
      # STUBYARD_SEED: /config
    volumes:
      - stubyard-data:/data  # SQLite DB, stored emails, HTTPS CA + certificate
      # - ./seed:/config:ro  # stubyard-<project>.json exports (GET /api/projects/<p>/export) for STUBYARD_SEED
    extra_hosts:
      # Lets stubyard call apps running directly on your machine (http://host.docker.internal:<port>)
      - "host.docker.internal:host-gateway"
    networks:
      stubyard:
        # Reachable from app containers as both "stubyard" and the pre-rename "devhub".
        aliases: [stubyard, devhub]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/system').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  stubyard-data:
    # Docker name kept from the pre-rename "devhub" releases so existing data carries over.
    name: devhub-data

networks:
  # Shared network: attach app containers to it and reach stubyard at http://stubyard:4000 / smtp stubyard:1025.
  # Docker name kept as "devhub" (pre-rename) so existing app compose files keep working.
  stubyard:
    name: devhub
