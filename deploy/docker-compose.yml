# devhub — Developer Testing Hub (standalone)
#
# Start:   docker compose -f deploy/docker-compose.yml up -d --build
# Open:    http://localhost:4000
# Stop:    docker compose -f deploy/docker-compose.yml down        (data is kept)
# Wipe:    docker compose -f deploy/docker-compose.yml down -v     (deletes all data, incl. the HTTPS CA)
#
# Agent guide: http://localhost:4000/api/agent-guide (source: docs/AGENT_GUIDE.md)
#
# Linux, app on the host bound to 127.0.0.1? devhub's callbacks cannot reach it from this container. Either start the
# app on 0.0.0.0 and use http://host.docker.internal:<port>, or use deploy/docker-compose.host-network.yml.

name: devhub

services:
  devhub:
    image: devhub:latest
    build:
      context: ..            # repository root (contains the Dockerfile)
      dockerfile: Dockerfile
    container_name: devhub
    hostname: devhub
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1: only this machine can reach devhub. Remove "127.0.0.1:" to expose on the LAN.
      - "127.0.0.1:${DEVHUB_HTTP_PORT:-4000}:4000"    # dashboard, REST API, /mock and /hook endpoints
      - "127.0.0.1:${DEVHUB_HTTPS_PORT:-4443}:4443"   # the same over HTTPS (local CA)
      - "127.0.0.1:${DEVHUB_SMTP_PORT:-1025}:1025"    # SMTP for apps
    environment:
      DEVHUB_LOG_LEVEL: ${DEVHUB_LOG_LEVEL:-info}
      # Extra hostnames/IPs for the HTTPS certificate (comma separated), e.g. "myhost.local,10.0.0.5"
      DEVHUB_TLS_NAMES: ${DEVHUB_TLS_NAMES:-}
      # Browser-facing base for login-provider pages (authorize/logout), e.g. https://localhost:14443 behind an SSH tunnel
      DEVHUB_PUBLIC_URL: ${DEVHUB_PUBLIC_URL:-}
      # Max bytes of each request/response body kept in the traffic log (bigger bodies are truncated and flagged)
      DEVHUB_MAX_LOG_BODY_BYTES: ${DEVHUB_MAX_LOG_BODY_BYTES:-1048576}
      # Set to 1 to advertise SMTP STARTTLS (clients must then trust the devhub CA)
      DEVHUB_SMTP_STARTTLS: ${DEVHUB_SMTP_STARTTLS:-0}
      # Hosts devhub may call (callbacks, event webhooks, webhook templates). Empty = safe default (localhost,
      # host.docker.internal, *.local, *.test, *.internal, private IPs, docker service names). "+a.com,b.org" adds, "*" = any.
      DEVHUB_OUTBOUND_ALLOW: ${DEVHUB_OUTBOUND_ALLOW:-}
      # 1 = accept self-signed HTTPS when calling your app (or a host list: "myapp.test,*.local")
      DEVHUB_OUTBOUND_INSECURE_TLS: ${DEVHUB_OUTBOUND_INSECURE_TLS:-0}
      # AI chat provider keys (optional; set them in .env next to this file). Env keys win over keys stored in the dashboard.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Import project exports at start if their slug doesn't exist yet (a .json file or a directory of them).
      # Uncomment together with the ./seed volume below.
      # DEVHUB_SEED: /config
    volumes:
      - devhub-data:/data    # SQLite DB, stored emails, HTTPS CA + certificate
      # - ./seed:/config:ro  # devhub-<project>.json exports (GET /api/projects/<p>/export) for DEVHUB_SEED
    extra_hosts:
      # Lets devhub call apps running directly on your machine (http://host.docker.internal:<port>)
      - "host.docker.internal:host-gateway"
    networks:
      - devhub
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/system').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  devhub-data:
    name: devhub-data

networks:
  # Shared network: attach app containers to it and reach devhub at http://devhub:4000 / smtp devhub:1025
  devhub:
    name: devhub
